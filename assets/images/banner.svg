  <line x1="0" y1="55" x2="900" y2="55" stroke="#1a3a5c" stroke-width="0.5"/>
  <line x1="0" y1="110" x2="900" y2="110" stroke="#1a3a5c" stroke-width="0.5"/>
  <line x1="0" y1="165" x2="900" y2="165" stroke="#1a3a5c" stroke-width="0.5"/>
  <line x1="150" y1="0" x2="150" y2="220" stroke="#1a3a5c" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="220" stroke="#1a3a5c" stroke-width="0.5"/>
  <line x1="450" y1="0" x2="450" y2="220" stroke="#1a3a5c" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="220" stroke="#1a3a5c" stroke-width="0.5"/>
  <line x1="750" y1="0" x2="750" y2="220" stroke="#1a3a5c" stroke-width="0.5"/>
  <!-- Code shapes decorative -->
  <rect x="30" y="30" width="80" height="12" rx="3" fill="#1e4d7b"/>
  <rect x="30" y="50" width="120" height="12" rx="3" fill="#1e4d7b"/>
  <rect x="50" y="70" width="90" height="12" rx="3" fill="#133352"/>
